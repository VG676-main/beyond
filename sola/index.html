<!DOCTYPE html>
<html lang="en" data-theme="sol">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4EFE6">
  <script>
    (function () {
      var path = location.pathname;
      if (!path.endsWith("/")) path = path.replace(/[^/]+$/, "");
      if (!path.endsWith("/")) path += "/";
      var base = document.createElement("base");
      base.href = path;
      document.head.appendChild(base);
      try {
        var saved = JSON.parse(localStorage.getItem("sola-settings") || "{}");
        var themes = { sol: 1, moon: 1, sage: 1, lavender: 1, ocean: 1, rose: 1 };
        var theme = themes[saved.theme] ? saved.theme : "sol";
        document.documentElement.setAttribute("data-theme", theme);
        var colors = {
          sol: "#F4EFE6",
          moon: "#0E141B",
          sage: "#EEF3EC",
          lavender: "#F3F0F7",
          ocean: "#EEF4F6",
          rose: "#F8F0EE"
        };
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", colors[theme]);
      } catch (error) {}
    })();
  </script>
  <meta name="description" content="Sola is a quiet personal planner for today and the month ahead.">
  <meta name="application-name" content="Sola">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sola">
  <meta name="format-detection" content="telephone=no">
  <title>Sola</title>
